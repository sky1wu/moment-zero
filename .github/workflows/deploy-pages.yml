name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Generate today's challenge
        run: node scripts/generate-daily-challenge.mjs github-pages-dist/daily.json
        env:
          DAILY_SEED_SECRET: ${{ secrets.DAILY_SEED_SECRET }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-pages-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
